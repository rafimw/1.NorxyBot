<!DOCTYPE html>
<html>
  <head>
    <title>Norxy Assistence</title>

    <link rel="icon" type="image/png" href="./favicon.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

      /* NORXY Typing Indicator */

      .typing-indicator {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .typing-profile {
        width: 45px;
        height: 45px;
        object-fit: contain;
      }

      .typing-bubble {
        display: flex;
        align-items: center;
        gap: 5px;
        background-color: rgb(238, 238, 238);
        padding: 15px 18px;
        border-radius: 10px;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        background-color: #777;
        border-radius: 50%;
        animation: norxyTyping 1.2s infinite ease-in-out;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes norxyTyping {
        0%, 60%, 100% {
          transform: translateY(0);
          opacity: 0.4;
        }

        30% {
          transform: translateY(-7px);
          opacity: 1;
        }
      }

      .typing-label {
        font-size: 12px;
        color: #777;
        margin-left: 3px;
      }

      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button {
        background-color: rgb(25, 69, 135);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        width: 100%;
        margin-bottom: 20px;
        box-sizing: border-box;
      }

      .app-container {
        width: 100%;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;

        height: 100vh;
        display: flex;
        flex-direction: column;

        box-sizing: border-box;
        padding: 0 15px;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }

      .chat-message-robot {
        display: flex;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-profile {
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;

      }

      @media (max-width: 600px) {
        .app-container {
          height: 100dvh;
          overflow: hidden;
        }
        .chat-messages-container {
          min-height: 0;
          overflow-y: auto;
          margin-bottom: 10px;
        }
        .chat-input-container {
          flex-shrink: 0;
          margin-bottom: 10px;
        }

      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <!-- <script src="https://unpkg.com/supersimpledev/chatbot.js"></script> -->
    <!-- <script src="ChatBot.js"></script> -->

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages,setChatMessages,setIsTyping}) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function handleKeyDown(event) {
        if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
          }
        } 


        async function sendMessage() {
          const userMessage = inputText.trim();

          // Jangan kirim pesan kosong
          if (!userMessage) return;

          // Simpan pesan pengguna
          const newMessage = {
            message: userMessage,
            sender: 'user',
            id: crypto.randomUUID()
          };

          // Tampilkan pesan pengguna di layar
          setChatMessages(prev => [...prev, newMessage]);

          // Kosongkan input
          setInputText('');
          
          setIsTyping(true);

          try {
            // Hubungkan React ke backend Ollama
            const response = await fetch(

            
              //Rubah URL ini dengan tunneling gratis dari Cloudflare Tunnel atau Ngrok
              'https://residential-sent-hopkins-aus.trycloudflare.com',
              //Rubah URL ini dengan tunneling gratis dari Cloudflare Tunnel atau Ngrok

              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  message: userMessage,
                  history: chatMessages
                })
              }
            );

            const data = await response.json();

            // Periksa apakah backend berhasil
            if (!response.ok) {
              throw new Error(
                data.detail || data.error || 'Gagal menghubungi chatbot.'
              );
            }

            // Tampilkan jawaban Llama
            setChatMessages(prev => [
              ...prev,
              {
                message: data.response,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);

          } catch (error) {
            console.error('Chatbot Error:', error);

            // Tampilkan pesan jika terjadi kesalahan
            setChatMessages(prev => [
              ...prev,
              {
                message: 'Maaf, chatbot sedang mengalami gangguan: ' + error.message,
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);
          }finally {
            setIsTyping(false);
          }

        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to Chatbot"
              //size="30"
              onChange={saveInputText}
              onKeyDown={handleKeyDown}
              value={inputText}
              className="chat-input"
            />
            <button
              onClick={sendMessage}
              className="send-button"
            >Send</button>
          </div>
        );
      }


      function TypingIndicator() {
        return (
          <div className="typing-indicator">

            <img
              src="Robot.png"
              className="typing-profile"
              alt="NORXY"
            />

            <div className="typing-bubble">

              <span className="typing-dot"></span>
              <span className="typing-dot"></span>
              <span className="typing-dot"></span>

              <span className="typing-label">
                Typing...
              </span>

            </div>

          </div>
        );
      }


// ==================================
// CHAT MESSAGE COMPONENT
// ==================================

function ChatMessage({ message, sender }) {

  return (
    <div className={
      sender === 'user'
        ? 'chat-message-user'
        : 'chat-message-robot'
    }>

      {sender === 'robot' && (
        <img
          src="Robot.png"
          className="chat-message-profile"
          alt="NORXY"
        />
      )}

      <div className="chat-message-text">
        {message}
      </div>

      {sender === 'user' && (
        <img
          src="user.png"
          className="chat-message-profile"
          alt="User"
        />
      )}

    </div>
  );
}


// ==================================
// CHAT MESSAGES COMPONENT
// ==================================

function ChatMessages({ chatMessages, isTyping }) {

  const chatMessagesRef = React.useRef(null);

  React.useEffect(() => {

    const containerElem = chatMessagesRef.current;

    if (containerElem) {
      containerElem.scrollTop =
        containerElem.scrollHeight;
    }

  }, [chatMessages, isTyping]);

  return (
    <div
      className="chat-messages-container"
      ref={chatMessagesRef}
    >

      {chatMessages.map((chatMessage) => (
        <ChatMessage
          message={chatMessage.message}
          sender={chatMessage.sender}
          key={chatMessage.id}
        />
      ))}

      {isTyping && <TypingIndicator />}

    </div>
  );
}

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        const [isTyping, setIsTyping] = React.useState(false);

        return (
          <div className="app-container">
            <ChatMessages
              chatMessages={chatMessages}
              isTyping={isTyping}
            />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              setIsTyping={setIsTyping}
            />
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
